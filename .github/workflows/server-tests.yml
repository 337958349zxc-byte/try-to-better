name: Companion service checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run isolated companion-service tests
        working-directory: server
        run: python -m unittest -v test_server
